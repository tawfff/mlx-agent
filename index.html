<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mlx-agent</title>
<style>
/* mlx-agent: 90s hacker phosphor terminal. Built on the trading-terminal system, shifted to green. */
:root {
  color-scheme: dark;
  --bg: #04070a;
  --surface: #081310;
  --surface-2: #0e1f18;
  --fg: #d6ffe4;
  --fg-2: #8fe6ab;
  --muted: #4f9b6c;
  --meta: #3a7a52;
  --border: rgba(43, 255, 136, 0.16);
  --border-soft: rgba(43, 255, 136, 0.08);
  --accent: #2bff88;
  --accent-hover: #6bffae;
  --accent-on: #022012;
  --ok: #2bff88;
  --warn: #ffd23b;
  --danger: #ff4d4d;
  --glow: 0 0 6px rgba(43, 255, 136, 0.55);
  --font: "Berkeley Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --mono: var(--font);
  --r-sm: 3px; --r-md: 4px; --r-lg: 6px; --r-xl: 8px;
  --focus: 0 0 0 1px var(--accent), 0 0 10px rgba(43, 255, 136, 0.4);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font);
  -webkit-font-smoothing: antialiased; letter-spacing: 0.01em;
  display: grid; grid-template-columns: 256px 1fr; overflow: hidden;
}
/* CRT scanlines + faint vignette over the whole window. */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px),
              radial-gradient(120% 120% at 50% 0%, transparent 55%, rgba(0,0,0,0.5) 100%);
  mix-blend-mode: multiply;
}
@media (prefers-reduced-motion: no-preference) {
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 9998; pointer-events: none; opacity: 0.5;
    background: linear-gradient(rgba(43,255,136,0.05), transparent 40%);
    animation: crtflicker 7s infinite steps(60);
  }
}
@keyframes crtflicker { 0%,96%,100% { opacity: 0.35; } 97% { opacity: 0.55; } 98% { opacity: 0.25; } }
button, select, textarea, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }

/* Sidebar */
aside { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; padding: 4px 10px 10px; }
.new {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--border);
  font-weight: 510; font-size: 14px; color: var(--fg);
}
.new:hover { background: var(--surface); }
kbd { font: 12px var(--font); color: var(--meta); }
.label { font-size: 12px; color: var(--meta); padding: 18px 10px 6px; font-weight: 510; }
nav { flex: 1; overflow-y: auto; min-height: 0; }
.item { display: flex; align-items: center; border-radius: var(--r-sm); }
.item a {
  flex: 1; min-width: 0; padding: 6px 10px; font-size: 14px; color: var(--fg-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; cursor: default;
}
.item:hover { background: var(--surface); }
.item.on { background: var(--surface-2); }
.item.on a { color: var(--fg); }
.del { opacity: 0; padding: 4px 8px; font-size: 12px; color: var(--muted); border-radius: var(--r-sm); }
.item:hover .del, .del:focus-visible, .del.arm { opacity: 1; }
.del:hover { color: var(--fg); }
.del.arm { color: var(--danger); font-weight: 510; }
.none { color: var(--meta); font-size: 13px; padding: 6px 10px; }
#status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 10px 10px 2px; border-top: 1px solid var(--border-soft); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--meta); flex: none; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--danger); }

/* Main column */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
header { display: flex; align-items: center; gap: 8px; padding: 0 20px 8px; }
.picker { position: relative; display: flex; align-items: center; }
select {
  appearance: none; background: transparent; border: 1px solid transparent; border-radius: var(--r-md);
  padding: 6px 28px 6px 10px; font-weight: 510; font-size: 14px; max-width: 46vw; cursor: pointer;
}
select:hover { background: var(--surface); }
.picker::after { content: ""; position: absolute; right: 11px; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); pointer-events: none; }
.mstate { font-size: 12px; color: var(--meta); }
.spacer { flex: 1; }
.ghost { padding: 6px 10px; border-radius: var(--r-md); font-size: 13px; color: var(--muted); }
.ghost:hover { background: var(--surface); color: var(--fg); }

#scroll { flex: 1; overflow-y: auto; min-height: 0; }
#thread { max-width: 760px; margin: 0 auto; padding: 12px 28px 40px; }
.msg { margin: 0 0 28px; }
.user { display: flex; justify-content: flex-end; }
.user .bubble {
  background: var(--surface); border-radius: var(--r-xl); padding: 9px 16px; max-width: 82%;
  white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg);
}
.answer { color: var(--fg); overflow-wrap: anywhere; }
.answer > * + * { margin-top: 0.85em; }
.answer h1, .answer h2, .answer h3 { font-weight: 590; letter-spacing: -0.01em; line-height: 1.3; margin-top: 1.4em; }
.answer h1 { font-size: 22px; } .answer h2 { font-size: 19px; } .answer h3 { font-size: 16px; }
.answer ul, .answer ol { padding-left: 1.4em; }
.answer li + li { margin-top: 0.3em; }
.answer a { color: var(--accent-hover); }
.answer code { font: 13px var(--mono); background: var(--surface); padding: 1px 5px; border-radius: 4px; }
.answer pre { position: relative; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--r-md); padding: 14px 16px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
.answer pre .copy { position: absolute; top: 6px; right: 6px; font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: var(--r-sm); background: var(--surface-2); opacity: 0; }
.answer pre:hover .copy, .answer pre .copy:focus-visible { opacity: 1; }
.answer blockquote { border-left: 2px solid var(--border); padding-left: 14px; color: var(--fg-2); }
.answer table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
.answer th, .answer td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.answer hr { border: 0; border-top: 1px solid var(--border); }

details.think { margin-bottom: 12px; }
details.think summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; }
details.think summary::-webkit-details-marker { display: none; }
details.think summary::before { content: ""; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; }
details.think[open] summary::before { transform: rotate(45deg); }
details.think summary:hover { color: var(--fg); }
.think-body { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; color: var(--muted); padding: 8px 0 4px 11px; max-height: 340px; overflow-y: auto; }
.live summary span { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

.wait { font-size: 13px; color: var(--muted); }
.wait::after { content: ""; display: inline-block; width: 7px; height: 14px; margin-left: 4px; vertical-align: -2px; background: var(--muted); animation: pulse 1s steps(2) infinite; }
.cursor > :last-child::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--fg-2); animation: pulse 1s steps(2) infinite; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 10px; font-size: 12px; color: var(--meta); font-variant-numeric: tabular-nums; }
.meta button { font-size: 12px; color: var(--muted); padding: 2px 0; }
.meta button:hover { color: var(--fg); }
.err { margin-top: 8px; font-size: 13px; color: var(--danger); }

/* Agent tool steps */
.tool { margin: 8px 0; border: 1px solid var(--border-soft); border-radius: var(--r-md); overflow: hidden; }
.tool-head { display: flex; align-items: center; gap: 9px; padding: 8px 12px; font-size: 13px; color: var(--fg-2); }
.tool-ico { width: 15px; height: 15px; flex: none; color: var(--muted); }
.tool-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-label code { font: 12.5px var(--mono); background: var(--surface); padding: 1px 6px; border-radius: 4px; color: var(--fg); }
.tool.running .tool-ico { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tool.done .tool-ico { color: var(--ok); }
.tool.denied .tool-ico, .tool.error .tool-ico { color: var(--danger); }
.tool-out { border-top: 1px solid var(--border-soft); }
.tool-out summary { list-style: none; cursor: pointer; padding: 7px 12px; font-size: 12px; color: var(--muted); }
.tool-out summary::-webkit-details-marker { display: none; }
.tool-out summary:hover { color: var(--fg); }
.tool-out pre { margin: 0; padding: 10px 12px; background: var(--surface); font: 12px var(--mono); line-height: 1.5; max-height: 300px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.approve { border-top: 1px solid var(--border-soft); padding: 11px 12px; background: color-mix(in oklab, var(--warn), transparent 90%); }
.approve .cmd { display: block; font: 12.5px var(--mono); background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
.approve-msg { font-size: 12px; color: var(--muted); margin: 8px 0 9px; }
.approve-btns { display: flex; gap: 8px; }
.approve-btns button { font-size: 13px; font-weight: 510; padding: 6px 15px; border-radius: var(--r-sm); }
.approve-btns .run { background: var(--accent); color: var(--accent-on); }
.approve-btns .run:hover { background: var(--accent-hover); }
.approve-btns .deny { background: var(--surface-2); color: var(--fg); }

/* Composer */
.dock { padding: 0 28px 18px; }
form { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 12px 12px 10px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
form:focus-within { border-color: color-mix(in oklab, var(--fg), transparent 80%); }
textarea { resize: none; border: 0; background: transparent; outline: none; max-height: 40vh; min-height: 24px; line-height: 1.5; padding: 4px 0; }
textarea:focus-visible { box-shadow: none; }
textarea::placeholder { color: var(--meta); }
#send { background: var(--accent); color: var(--accent-on); font-weight: 510; font-size: 13px; padding: 7px 14px; border-radius: 10px; transition: background .12s, opacity .12s; }
#send:hover { background: var(--accent-hover); }
#send:disabled { opacity: 0.35; cursor: default; background: var(--accent); }
#send.stop { background: var(--surface-2); color: var(--fg); }
.hint { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--meta); }

/* Empty state: the composer sits in the middle of the page, like a fresh notebook. */
main.empty #scroll { flex: 0 0 auto; }
main.empty .dock { margin-top: 18vh; }
.hello { display: none; max-width: 760px; margin: 0 auto 22px; padding: 0 4px; }
main.empty .hello { display: block; }
.hello h1 { font-size: 30px; font-weight: 510; letter-spacing: -0.022em; line-height: 1.15; }
.hello p { color: var(--muted); margin-top: 8px; font-size: 14px; }
.starters { display: none; max-width: 760px; margin: 14px auto 0; flex-wrap: wrap; gap: 8px; }
main.empty .starters { display: flex; }
.starters button { border: 1px solid var(--border); border-radius: var(--r-pill, 999px); padding: 6px 12px; font-size: 13px; color: var(--fg-2); }
.starters button:hover { background: var(--surface); color: var(--fg); }

/* Settings */
dialog { margin: auto; width: min(520px, 92vw); background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { font-size: 17px; font-weight: 590; }
dialog label { display: block; font-size: 13px; font-weight: 510; margin: 18px 0 6px; }
dialog .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
dialog textarea { width: 100%; min-height: 110px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; }
dialog input[type=range] { width: 100%; accent-color: var(--accent); }
.row { display: flex; justify-content: space-between; align-items: center; }
.actions { display: flex; justify-content: flex-end; margin-top: 20px; }
.actions button { background: var(--surface-2); padding: 7px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 510; }

/* ===== mlx-agent brand: CRT dog + glitch wordmark + phosphor glow ===== */
.brand { display: flex; align-items: center; gap: 11px; padding: 10px 6px 14px; }
.wordmark {
  font-weight: 700; letter-spacing: 0.22em; color: var(--accent);
  text-shadow: 0 0 8px rgba(43,255,136,0.7), 0 0 2px rgba(43,255,136,0.9);
  position: relative;
}
.brand .wordmark { font-size: 20px; }
.hello .wordmark { font-size: 46px; letter-spacing: 0.16em; margin: 14px 0 0; }
.wordmark::before, .wordmark::after {
  content: attr(data-text); position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .wordmark::before { color: #19e0ff; left: 1px; text-shadow: none; clip-path: inset(0 0 55% 0); animation: glitch 4.2s infinite steps(2); }
  .wordmark::after  { color: #ff2fd0; left: -1px; text-shadow: none; clip-path: inset(55% 0 0 0); animation: glitch 3.1s infinite steps(2) reverse; }
}
@keyframes glitch { 0%,92%,100% { transform: translate(0); opacity: 0; } 93% { transform: translate(-2px,1px); opacity: .8; } 96% { transform: translate(2px,-1px); opacity: .7; } }

.crt { position: relative; flex: none; border-radius: 4px; overflow: hidden; background: #02140b;
  border: 1px solid rgba(43,255,136,0.35); box-shadow: 0 0 10px rgba(43,255,136,0.25), inset 0 0 18px rgba(0,0,0,0.7); }
.crt-sm { width: 44px; height: 44px; }
.crt-lg { width: 130px; height: 130px; margin: 0 auto; border-radius: 6px; }
.crt-dog { position: absolute; inset: 10%; display: block; image-rendering: pixelated;
  background: url(sprite-sheet.png) 0 0 / 300% 100% no-repeat;
  filter: drop-shadow(0 0 3px rgba(43,255,136,0.55)); }
@media (prefers-reduced-motion: no-preference) {
  .crt-dog { animation: dogframes 6.5s infinite step-end, dogbob 3.2s ease-in-out infinite; }
}
/* Frames: 0% open, 50% blink, 100% ear flick. */
@keyframes dogframes {
  0% { background-position: 0% 0; } 38% { background-position: 50% 0; } 40% { background-position: 0% 0; }
  70% { background-position: 100% 0; } 76% { background-position: 0% 0; }
  86% { background-position: 50% 0; } 88% { background-position: 0% 0; }
}
@keyframes dogbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2%); } }
.crt-glass { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0, rgba(0,0,0,0.28) 1px, transparent 1px, transparent 3px),
              radial-gradient(130% 100% at 50% 0%, rgba(43,255,136,0.12), transparent 60%); }
.crt-scan { position: absolute; left: 0; right: 0; height: 24%; pointer-events: none;
  background: linear-gradient(rgba(43,255,136,0), rgba(43,255,136,0.18), rgba(43,255,136,0)); }
@media (prefers-reduced-motion: no-preference) { .crt-scan { animation: scan 3.4s linear infinite; } }
@keyframes scan { 0% { top: -25%; } 100% { top: 100%; } }

.new span, .starters button { text-transform: lowercase; }
button:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { box-shadow: var(--focus); }
.answer a, .meta a:hover, #send { text-shadow: 0 0 5px rgba(43,255,136,0.4); }
#send { box-shadow: 0 0 10px rgba(43,255,136,0.35); }
.dot.ok { box-shadow: 0 0 7px var(--ok); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="crt crt-sm"><span class="crt-dog" role="img" aria-label="mlx-agent, a pixel dog"></span><span class="crt-scan"></span><span class="crt-glass"></span></div>
    <div class="wordmark" data-text="mlx-agent">mlx-agent</div>
  </div>
  <button class="new" id="new" type="button"><span>&#9655; new session</span> <kbd>&#8984;N</kbd></button>
  <div class="label">// recent</div>
  <nav id="list" aria-label="Chats"></nav>
  <div id="status" role="status"><span class="dot" id="dot"></span><span id="statusText">linking to LM Studio</span></div>
</aside>

<main id="main" class="empty">
  <header>
    <div class="picker"><select id="model" aria-label="Model"></select></div>
    <span class="mstate" id="mstate"></span>
    <span class="spacer"></span>
    <button class="ghost" id="agentToggle" type="button" aria-pressed="true">Tools: on</button>
    <button class="ghost" id="openSettings" type="button">Settings</button>
  </header>
  <div id="scroll"><div id="thread" aria-live="polite"></div></div>
  <div class="dock">
    <div class="hello">
      <div class="crt crt-lg"><span class="crt-dog" role="img" aria-label="mlx-agent, a pixel dog"></span><span class="crt-scan"></span><span class="crt-glass"></span></div>
      <h1 class="wordmark" data-text="mlx-agent">mlx-agent</h1>
      <p>Your box. Your model. It searches the web, reads pages, and runs commands on this Mac.</p>
    </div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="> ask anything, or give it a task" aria-label="Message"></textarea>
      <button id="send" type="submit" disabled>run</button>
    </form>
    <div class="starters" id="starters">
      <button type="button">Find the devices on my local network</button>
      <button type="button">Search the web for the latest news on local LLMs</button>
      <button type="button">Write and save a Python script that renames photos by date</button>
    </div>
    <p class="hint" id="hint">Enter to send, Shift+Enter for a new line</p>
  </div>
</main>

<dialog id="settings">
  <h2>Settings</h2>
  <label for="system">Instructions for every chat <span class="sub">sent as the system prompt</span></label>
  <textarea id="system" placeholder="e.g. Be direct. Answer in plain English."></textarea>
  <label for="temp"><span class="row"><span>Temperature <span class="sub">1.0 is what Qwen recommends</span></span><span id="tempVal"></span></span></label>
  <input id="temp" type="range" min="0" max="1.5" step="0.05">
  <div class="actions"><button type="button" id="closeSettings">Done</button></div>
</dialog>

<script src="marked.umd.js"></script>
<script src="lib.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Model output is untrusted: raw HTML is shown as text, only web links survive, and
// images become links so nothing is fetched from the internet behind your back.
marked.use({ gfm: true, renderer: {
  html: (t) => esc(t.text),
  link({ href, tokens }) { const text = this.parser.parseInline(tokens); return /^(https?:|mailto:)/i.test(href) ? `<a href="${esc(href)}">${text}</a>` : text; },
  image: ({ href, text }) => /^https?:/i.test(href) ? `<a href="${esc(href)}">${esc(text || href)}</a>` : esc(text),
} });

let data = { settings: { model: '', system: '', temperature: 1.0 }, chats: [] };
let current = null;
let models = [];
let ctrl = null;
let saveTimer;

const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => fetch('/data', { method: 'PUT', body: JSON.stringify(data) }).catch(() => {}), 250); };
const chat = () => data.chats.find((c) => c.id === current);
const shortName = (id) => (id || '').split('/').pop().replace(/-mlx$/i, '');

function copyText(t) {
  const a = document.createElement('textarea');
  a.value = t; a.style.cssText = 'position:fixed;opacity:0';
  document.body.append(a); a.select(); document.execCommand('copy'); a.remove();
}

/* Models + LM Studio status */
function setStatus(kind, text) { $('#dot').className = 'dot ' + kind; $('#statusText').textContent = text; }

async function loadModels(attempt = 0) {
  try {
    const r = await fetch('/api/v0/models');
    if (!r.ok) throw new Error();
    models = (await r.json()).data.filter((m) => m.type !== 'embeddings');
    const sel = $('#model');
    const pick = models.find((m) => m.id === data.settings.model) || models.find((m) => m.state === 'loaded') || models[0];
    sel.innerHTML = models.map((m) => `<option value="${esc(m.id)}">${esc(shortName(m.id))}</option>`).join('');
    if (pick) { sel.value = pick.id; if (data.settings.model !== pick.id) { data.settings.model = pick.id; save(); } }
    showModelState();
    setStatus('ok', `LM Studio running, ${models.length} model${models.length === 1 ? '' : 's'}`);
  } catch {
    // The app starts LM Studio's server on the first failed call; give it a moment.
    setStatus(attempt < 8 ? 'warn' : 'bad', attempt < 8 ? 'Starting LM Studio' : 'LM Studio is not responding. Is it installed?');
    if (attempt < 8) setTimeout(() => loadModels(attempt + 1), 2500);
  }
}

function showModelState() {
  const m = models.find((x) => x.id === $('#model').value);
  if (!m) return ($('#mstate').textContent = '');
  const fmt = `${m.quantization} ${m.compatibility_type.toUpperCase()}`;
  $('#mstate').textContent = m.state === 'loaded' ? `${fmt}, in memory` : `${fmt}, loads on first message`;
}

/* Sidebar */
function renderList() {
  const nav = $('#list');
  if (!data.chats.length) { nav.innerHTML = '<p class="none">Your chats will show up here.</p>'; return; }
  nav.innerHTML = data.chats.map((c) => `<div class="item${c.id === current ? ' on' : ''}" data-id="${c.id}">
    <a href="#" title="${esc(c.title)}">${esc(c.title)}</a><button class="del" type="button" aria-label="Delete chat">Delete</button></div>`).join('');
}

$('#list').addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (!item) return;
  e.preventDefault();
  const del = e.target.closest('.del');
  if (!del) return openChat(item.dataset.id);
  if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = 'Confirm'; setTimeout(() => { del.classList.remove('arm'); del.textContent = 'Delete'; }, 2500); return; }
  data.chats = data.chats.filter((c) => c.id !== item.dataset.id);
  if (current === item.dataset.id) newChat(); else renderList();
  save();
});

function openChat(id) {
  if (ctrl) return;
  current = id;
  renderList(); renderThread();
  $('#scroll').scrollTop = $('#scroll').scrollHeight;
  $('#input').focus();
}

function newChat() {
  if (ctrl) ctrl.abort();
  current = null;
  renderList(); renderThread();
  $('#input').focus();
}

/* Thread */
function renderThread() {
  const c = chat();
  $('#main').classList.toggle('empty', !c);
  $('#thread').innerHTML = '';
  if (!c) return;
  c.messages.forEach((m, i) => $('#thread').append(m.role === 'user' ? userNode(m) : asstNode(m, i === c.messages.length - 1)));
}

function userNode(m) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="bubble">${esc(m.content)}</div>`;
  return d;
}

function asstNode(m, last) {
  const d = document.createElement('div');
  d.className = 'msg';
  paint(d, m, { last });
  return d;
}

function paint(d, m, { live = false, last = false, waitText = '' } = {}) {
  let html = '';
  if (m.think) {
    const label = live && !m.content ? '<span>Thinking</span>' : `Thought for ${m.meta?.thinkSecs ?? Math.max(1, Math.round(m.thinkSecs || 0))}s`;
    const open = d.querySelector('details.think')?.open ? ' open' : '';
    html += `<details class="think${live && !m.content ? ' live' : ''}"${open}><summary>${label}</summary><div class="think-body">${esc(m.think)}</div></details>`;
  }
  if (m.tools) for (const t of m.tools) html += toolStepHTML(t);
  if (m.content) html += `<div class="answer${live ? ' cursor' : ''}">${marked.parse(m.content)}</div>`;
  else if (live && !m.think && !(m.tools && m.tools.length)) html += `<div class="wait">${esc(waitText || 'Waiting for the model')}</div>`;
  if (m.error) html += `<div class="err">${esc(m.error)}</div>`;
  if (!live) {
    const bits = [];
    if (m.meta) {
      bits.push(esc(shortName(m.meta.model)));
      if (m.meta.tps) bits.push(`${m.meta.tps.toFixed(1)} tokens/s`);
      if (m.meta.tokens) bits.push(`${m.meta.tokens} tokens`);
      if (m.meta.ttft != null) bits.push(`first token in ${m.meta.ttft.toFixed(1)}s`);
      if (m.meta.stopped) bits.push('stopped');
    }
    const btns = (m.content ? '<button type="button" data-act="copy">Copy</button>' : '') + (last ? '<button type="button" data-act="retry">Retry</button>' : '');
    html += `<div class="meta">${bits.map((b) => `<span>${b}</span>`).join('')}${btns}</div>`;
  }
  const keepScroll = d.querySelector('.think-body')?.scrollTop;
  d.innerHTML = html;
  const tb = d.querySelector('.think-body');
  if (tb) tb.scrollTop = live ? tb.scrollHeight : keepScroll || 0;
  d.querySelectorAll('pre').forEach((pre) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';
    b.onclick = () => { copyText(pre.querySelector('code')?.innerText ?? pre.innerText); b.textContent = 'Copied'; setTimeout(() => (b.textContent = 'Copy'), 1200); };
    pre.append(b);
  });
  d.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => {
    if (b.dataset.act === 'copy') { copyText(m.content); b.textContent = 'Copied'; setTimeout(() => (b.textContent = 'Copy'), 1200); }
    else retry();
  }));
}

const ICON = {
  web_search: '<svg class="tool-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
  fetch_url: '<svg class="tool-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/></svg>',
  run_command: '<svg class="tool-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 10l3 2-3 2M13 14h3"/></svg>',
};
function toolLabel(t) {
  const a = t.args || {};
  if (t.name === 'web_search') return `Searched the web for &ldquo;${esc(a.query || '')}&rdquo;`;
  if (t.name === 'fetch_url') return `Read <code>${esc(a.url || '')}</code>`;
  if (t.name === 'run_command') return t.status === 'awaiting' ? 'Wants to run a command' : `Ran <code>${esc(a.command || '')}</code>`;
  return esc(t.name);
}
function toolStepHTML(t) {
  const cls = t.status === 'running' || t.status === 'awaiting' ? 'running' : t.status;
  let h = `<div class="tool ${cls}"><div class="tool-head">${ICON[t.name] || ICON.run_command}<span class="tool-label">${toolLabel(t)}</span></div>`;
  if (t.status === 'awaiting') {
    h += `<div class="approve"><code class="cmd">${esc(t.args?.command || '')}</code>`
       + `<div class="approve-msg">Run this on your Mac?</div>`
       + `<div class="approve-btns"><button type="button" class="run" onclick="resolveApproval('${t.id}',true)">Approve</button>`
       + `<button type="button" class="deny" onclick="resolveApproval('${t.id}',false)">Deny</button></div></div>`;
  } else if (t.result) {
    const label = t.status === 'denied' ? 'Not run' : t.status === 'error' ? 'Error' : 'Result';
    h += `<details class="tool-out"><summary>${label}</summary><pre>${esc(t.result)}</pre></details>`;
  }
  return h + `</div>`;
}

const nearBottom = () => { const s = $('#scroll'); return s.scrollHeight - s.scrollTop - s.clientHeight < 120; };

/* Talking to the model */
async function send(text) {
  text = text.trim();
  if (!text || ctrl) return;
  if (!$('#model').value) return loadModels();
  let c = chat();
  if (!c) { c = { id: uid(), title: titleFrom(text), created: Date.now(), messages: [] }; data.chats.unshift(c); current = c.id; }
  c.messages.push({ role: 'user', content: text });
  $('#input').value = ''; autosize(); syncSend();
  renderList(); renderThread();
  await generate(c);
}

function retry() {
  const c = chat();
  if (!c || ctrl) return;
  if (c.messages.at(-1)?.role === 'assistant') c.messages.pop();
  renderThread();
  generate(c);
}

/* Agent: tools the model can call, and the loop that runs them */
const MAX_STEPS = 24;
const TOOLS = [
  { type: 'function', function: { name: 'web_search', description: 'Search the web with DuckDuckGo. Use for current events, news, prices, documentation, or to find specific pages and Reddit or X threads. Returns titles, URLs and snippets.', parameters: { type: 'object', properties: { query: { type: 'string', description: 'The search query' } }, required: ['query'] } } },
  { type: 'function', function: { name: 'fetch_url', description: 'Fetch a web page or JSON API and return its readable text. Use to read a specific article, page, Reddit thread (read via old.reddit.com) or API after finding it. Pass one full URL.', parameters: { type: 'object', properties: { url: { type: 'string', description: 'The full URL to read' } }, required: ['url'] } } },
  { type: 'function', function: { name: 'run_command', description: "Run a shell command (zsh) on the user's own Mac and return its output. Use for local tasks: finding devices on the home network, git and gh, reading or writing files, checking system info. The user approves each command before it runs.", parameters: { type: 'object', properties: { command: { type: 'string', description: 'The shell command to run' } }, required: ['command'] } } },
];
const agentSystem = () => `You are mlx-agent, an autonomous assistant on the user's own Mac. You have three tools: web_search, fetch_url, and run_command (runs any zsh command on this Mac).

Your job is to DO the task, not describe it. Carry out every step yourself with your tools until the task is fully finished. Never reply with "here is what you need to do" or a numbered list of steps for the user to follow when you could perform those steps yourself. If a step can be done on this Mac - searching, downloading a file, unzipping, moving or uploading files, running a program, scanning the network - then call run_command and actually do it, then check the output and continue to the next step.

Chain as many tool calls as it takes. After each tool result, decide the next action and take it. Only stop to ask the user when you genuinely cannot continue: you need a password or secret, or a decision only they can make. Otherwise keep going until it is done, then report plainly what you did and the final result.

Be decisive and efficient: never repeat a search or command you already ran, build on results you already have, and do not re-plan a step you finished. For slow commands (large downloads, full scans) start them in the background and poll. Keep your thinking short. Today's date is ${new Date().toISOString().slice(0, 10)}.`;

const approvals = {};
window.resolveApproval = (id, ok) => { const r = approvals[id]; if (r) r(ok); };

async function generate(c) {
  const model = $('#model').value;
  const info = models.find((m) => m.id === model);
  const useTools = data.settings.agent !== false;
  const sys = [data.settings.system, useTools ? agentSystem() : ''].filter((s) => s && s.trim()).join('\n\n');
  const convo = buildMessages(sys, c.messages);

  ctrl = new AbortController();
  setBusy(true);
  // Loop-breaker: small local models re-run the same search/command for hours. Count how often
  // each exact tool call is seen; stop the turn once anything repeats too much, and never execute
  // the same call a 3rd time (hand the model a note telling it to stop and conclude instead).
  const seen = {};
  let looped = false;
  try {
    for (let step = 0; step < MAX_STEPS; step++) {
      const m = { role: 'assistant', content: '', think: '', model, tools: [] };
      c.messages.push(m);
      const node = asstNode(m, true);
      $('#thread').append(node);
      if (nearBottom()) $('#scroll').scrollTop = $('#scroll').scrollHeight;

      const r = await streamOnce(convo, model, info, m, node, useTools);
      m.meta = r.meta;
      if (ctrl.signal.aborted) { m.meta.stopped = true; paint(node, m, { last: true }); break; }
      if (!r.toolCalls.length) { paint(node, m, { last: true }); break; }

      // The model asked for tools: record the turn, run each one, feed results back, loop.
      convo.push({ role: 'assistant', content: r.content || '', tool_calls: r.toolCalls });
      for (const tc of r.toolCalls) {
        const key = tc.function.name + ':' + (tc.function.arguments || '');
        seen[key] = (seen[key] || 0) + 1;
        let res;
        if (seen[key] >= 3) {
          res = 'STOP: you have already run this exact call twice. Do not repeat it. Use the results you already have and give your final answer now.';
          const step2 = { id: tc.id || uid(), name: tc.function.name, args: {}, status: 'denied', result: 'Skipped: repeated call (loop guard).' };
          try { step2.args = JSON.parse(tc.function.arguments || '{}'); } catch {}
          m.tools.push(step2);
          looped = true;
        } else {
          res = await execTool(tc, m, node);
        }
        convo.push({ role: 'tool', tool_call_id: tc.id, content: res });
        if (ctrl.signal.aborted) break;
      }
      paint(node, m, { last: true });
      if (ctrl.signal.aborted) break;
      // If it has repeated itself across several calls, force one last answer instead of spinning.
      if (looped && Object.values(seen).filter((n) => n >= 3).length >= 2) {
        convo.push({ role: 'user', content: 'Stop searching. Give me your best answer from what you already found, and say plainly if you could not finish.' });
        const fin = { role: 'assistant', content: '', think: '', model, tools: [] };
        c.messages.push(fin);
        const fnode = asstNode(fin, true); $('#thread').append(fnode);
        const fr = await streamOnce(convo.filter((x) => x.role !== 'tool' || true), model, info, fin, fnode, false);
        fin.meta = fr.meta; fin.error = 'Stopped: it was repeating itself. This is the best answer from what it found.';
        paint(fnode, fin, { last: true });
        break;
      }
      if (step === MAX_STEPS - 1) m.error = 'Paused after ' + MAX_STEPS + ' steps. Say continue to keep going.';
    }
  } finally {
    ctrl = null;
    setBusy(false);
    save();
    loadModels();
  }
}

// One streaming completion. Fills m.content / m.think live, collects any tool calls.
async function streamOnce(convo, model, info, m, node, useTools) {
  const t0 = performance.now();
  let first = 0, thinkStart = 0, thinkEnd = 0, chunks = 0, usage = null, reasoning = '', raw = '', frame = 0, finish = '';
  const toolAcc = [];
  const repaint = () => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const stick = nearBottom();
      const secs = Math.round((performance.now() - t0) / 1000);
      const waitText = info && info.state !== 'loaded' && secs >= 2 ? `Loading ${shortName(model)} into memory, ${secs}s (the first message after a restart is slow)` : '';
      paint(node, m, { live: true, waitText });
      if (stick) $('#scroll').scrollTop = $('#scroll').scrollHeight;
    });
  };
  const ticker = setInterval(repaint, 1000);
  repaint();
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST', signal: ctrl.signal,
      // Qwen's official thinking-mode sampling; wrong sampling is the usual cause of endless thinking loops.
      body: JSON.stringify({ model, messages: convo, temperature: +data.settings.temperature, top_p: 0.95, top_k: 20, min_p: 0,
        ...(useTools ? { tools: TOOLS, tool_choice: 'auto' } : {}), stream: true, stream_options: { include_usage: true } }),
    });
    if (!res.ok) { let msg = `LM Studio said ${res.status}`; try { const j = await res.json(); msg = j.error?.message || j.error || msg; } catch {} throw new Error(msg); }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const out = parseSSE(buf + dec.decode(value, { stream: true }));
      buf = out.rest;
      for (const e of out.events) {
        if (e.error) throw new Error(e.error.message || e.error);
        if (e.usage) usage = e.usage;
        const choice = e.choices?.[0];
        if (choice?.finish_reason) finish = choice.finish_reason;
        const delta = choice?.delta;
        if (!delta) continue;
        if (delta.tool_calls) accToolCalls(toolAcc, delta);
        if (delta.reasoning_content) { reasoning += delta.reasoning_content; thinkStart ||= performance.now(); chunks++; }
        if (delta.content) { raw += delta.content; chunks++; if (thinkStart && !thinkEnd && !raw.includes('<think>')) thinkEnd = performance.now(); }
        if (!first && (delta.reasoning_content || delta.content || delta.tool_calls)) first = performance.now();
      }
      const s = splitThink(raw);
      if (s.think && !thinkStart) thinkStart = performance.now();
      if (s.think && !s.thinking && !thinkEnd) thinkEnd = performance.now();
      m.think = [reasoning.trim(), s.think].filter(Boolean).join('\n\n');
      m.content = s.answer;
      repaint();
    }
  } catch (err) {
    if (err.name !== 'AbortError') m.error = err.message === 'Load failed' ? 'Could not reach LM Studio. It may still be starting, try Retry.' : err.message;
  } finally {
    clearInterval(ticker);
    cancelAnimationFrame(frame);
  }
  // Fallback for models that print tool calls as text rather than the structured field.
  let toolCalls = toolAcc.filter(Boolean);
  if (!toolCalls.length && raw.includes('<tool_call>')) {
    toolCalls = parseToolCalls(raw);
    if (toolCalls.length) m.content = splitThink(raw.replace(/<tool_call>[\s\S]*?<\/tool_call>/g, '')).answer;
  }
  const end = performance.now();
  const tokens = usage?.completion_tokens || chunks;
  const meta = {
    model, tokens,
    tps: first && end - first > 200 ? tokens / ((end - first) / 1000) : 0,
    ttft: first ? (first - t0) / 1000 : null,
    thinkSecs: thinkStart ? Math.max(1, Math.round(((thinkEnd || end) - thinkStart) / 1000)) : undefined,
  };
  return { content: m.content, toolCalls, meta };
}

async function execTool(tc, m, node) {
  let args = {};
  try { args = JSON.parse(tc.function.arguments || '{}'); } catch {}
  const step = { id: tc.id || uid(), name: tc.function.name, args, status: 'running', result: '' };
  m.tools.push(step);
  const show = () => { paint(node, m, { live: true }); if (nearBottom()) $('#scroll').scrollTop = $('#scroll').scrollHeight; };
  show();
  // run_command waits for a click: the model never touches your shell without you seeing the exact command.
  if (step.name === 'run_command') {
    step.status = 'awaiting';
    show();
    const ok = await new Promise((r) => { approvals[step.id] = r; ctrl.signal.addEventListener('abort', () => r(false), { once: true }); });
    delete approvals[step.id];
    if (!ok) { step.status = 'denied'; step.result = 'The user declined to run this command.'; show(); return step.result; }
    step.status = 'running';
    show();
  }
  try {
    const res = await fetch('/tool', { method: 'POST', signal: ctrl.signal, body: JSON.stringify({ name: step.name, args }) });
    step.result = (await res.json()).result || '(no result)';
    step.status = 'done';
  } catch (e) {
    step.status = 'error';
    step.result = e.name === 'AbortError' ? 'Stopped.' : 'Tool failed: ' + e.message;
  }
  show();
  return step.result;
}

/* Composer */
const input = $('#input');
function autosize() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
function syncSend() { if (!ctrl) $('#send').disabled = !input.value.trim(); }
function setBusy(on) {
  const b = $('#send');
  b.textContent = on ? 'Stop' : 'Send';
  b.classList.toggle('stop', on);
  b.disabled = on ? false : !input.value.trim();
  $('#hint').textContent = on ? 'Esc to stop' : 'Enter to send, Shift+Enter for a new line';
}
input.addEventListener('input', () => { autosize(); syncSend(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
$('#form').addEventListener('submit', (e) => { e.preventDefault(); ctrl ? ctrl.abort() : send(input.value); });
$('#starters').addEventListener('click', (e) => { if (e.target.matches('button')) send(e.target.textContent); });
$('#new').addEventListener('click', newChat);
$('#model').addEventListener('change', (e) => { data.settings.model = e.target.value; showModelState(); save(); });
function syncAgentToggle() {
  const on = data.settings.agent !== false;
  const b = $('#agentToggle');
  b.textContent = 'Tools: ' + (on ? 'on' : 'off');
  b.setAttribute('aria-pressed', String(on));
}
$('#agentToggle').addEventListener('click', () => { data.settings.agent = data.settings.agent === false; syncAgentToggle(); save(); });
document.addEventListener('keydown', (e) => {
  if (e.metaKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newChat(); }
  if (e.key === 'Escape' && ctrl) ctrl.abort();
});
window.addEventListener('focus', () => { if (!ctrl) loadModels(); });

/* Settings */
$('#openSettings').addEventListener('click', () => {
  $('#system').value = data.settings.system;
  $('#temp').value = data.settings.temperature;
  $('#tempVal').textContent = (+data.settings.temperature).toFixed(2);
  $('#settings').showModal();
});
$('#temp').addEventListener('input', (e) => ($('#tempVal').textContent = (+e.target.value).toFixed(2)));
$('#settings').addEventListener('close', () => {
  data.settings.system = $('#system').value;
  data.settings.temperature = +$('#temp').value;
  save();
});
$('#closeSettings').addEventListener('click', () => $('#settings').close());

(async () => {
  try { const d = await (await fetch('/data')).json(); if (Array.isArray(d.chats)) data = { chats: d.chats, settings: { ...data.settings, ...d.settings } }; } catch {}
  renderList(); renderThread(); syncAgentToggle(); loadModels(); input.focus();
})();
</script>
</body>
</html>
